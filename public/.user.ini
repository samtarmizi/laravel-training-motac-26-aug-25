; Increase upload limits so Ollama Embed can accept files up to 5MB (Laravel validates max 5120 KB).
; PHP-FPM and some CGI setups read this file from public/.
; If you still get HTTP 413, increase Nginx: client_max_body_size 10m; or Apache: LimitRequestBody.
upload_max_filesize = 10M
post_max_size = 12M
